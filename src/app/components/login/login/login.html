<div class="login-container d-flex align-items-center justify-content-center vh-100 bg-light">
  <div class="card shadow-lg p-4" style="max-width: 400px; width: 100%;">
    <div class="text-center mb-4">
      <i class="bi bi-person-circle fs-1 text-primary"></i>
      <h4 class="mt-2 fw-bold">Iniciar Sesión</h4>
    </div>

    <form [formGroup]="form" (ngSubmit)="login()">
      <div class="form-floating mb-3">
        <input type="text" id="username" formControlName="username" class="form-control" placeholder="Usuario"/>
        <label for="username">Usuario</label>
      </div>

      <div class="form-floating mb-3">
        <input type="password" id="password" formControlName="password" class="form-control" placeholder="Contraseña"/>
        <label for="password">Contraseña</label>
      </div>

      <button
        class="btn btn-primary w-100"
        type="submit"
        [disabled]="form.invalid"
      >
        <i class="bi bi-box-arrow-in-right"></i> Ingresar
      </button>

      @if (error) {
        <div class="alert alert-danger mt-3 text-center py-2">
          {{ error }}
        </div>
      }
    </form>
  </div>
</div>
